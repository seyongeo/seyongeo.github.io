<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>

body{background:#080f08;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
input[type=number]::-webkit-inner-spin-button,

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const C = {
  bg:"#080f08", surface:"#101a10", card:"#162016", border:"#243424",
  accent:"#4ade80", accentLow:"rgba(74,222,128,0.12)", text:"#dff0df",
  dim:"#4d754d", gold:"#fbbf24", silver:"#94a3b8", bronze:"#b87333",
  pink:"#f9a8d4", blue:"#93c5fd", red:"#f87171",
};
const hdScore = (s) => s - 72;
const uid = () => Math.random().toString(36).slice(2,9);
const avg = (a) => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const rankColor = (r) => r===1?C.gold:r===2?C.silver:r===3?C.bronze:C.text;


// ── BFF helpers (replaces all golf-scores.md / GitHub PAT logic) ──
const bffBase = () => (localStorage.getItem('amp99_bff_url') || '').replace(/\/$/, '');
const bffPass = () => localStorage.getItem('amp99_bff_pass') || '';

async function bffFetch(path, opts = {}) {
  const url = bffBase();
  if (!url) throw new Error('BFF URL이 설정되지 않았습니다 (설정 탭에서 입력해 주세요)');
  const headers = {
    'X-Shared-Password': bffPass(),
    'Content-Type': 'application/json',
    ...(opts.adminAuth ? {'X-Admin-Password': opts.adminAuth} : {}),
    ...(opts.headers || {}),
  };
  const init = {method: opts.method || 'GET', headers};
  if (opts.body !== undefined) init.body = opts.body;
  const res = await fetch(`${url}${path}`, init);
  if (res.status === 204) return null;
  if (res.status === 401) throw new Error('BFF 비밀번호가 잘못되었습니다');
  if (res.status === 429) {
    const data = await res.json().catch(() => ({}));
    throw new Error(`이번 달 한도 초과 (${data.used ?? '?'}/${data.cap ?? '?'})`);
  }
  if (!res.ok) {
    const t = await res.text();
    throw new Error(`서버 오류: ${res.status} ${t}`);
  }
  return res.json();
}

const iSt = {background:"#060c06",border:`1px solid ${C.border}`,color:C.text,borderRadius:7,padding:"8px 10px",fontSize:13,outline:"none",width:"100%",boxSizing:"border-box",fontFamily:"inherit"};
const thSt = {background:"#0d150d",color:C.dim,fontSize:11,padding:"8px 5px",textAlign:"center",whiteSpace:"nowrap"};
const tdSt = {fontSize:12,padding:"9px 5px",textAlign:"center",borderBottom:`1px solid #131b13`};
const cardSt = {background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 16px",marginBottom:10};
const btn = (v="d") => ({padding:"9px 16px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"inherit",
  background:v==="p"?C.accent:v==="r"?C.red:v==="g"?"rgba(74,222,128,0.15)":C.surface,
  color:v==="p"?"#000":v==="g"?C.accent:C.text});
const gTag = (g) => ({fontSize:10,padding:"1px 5px",borderRadius:4,background:g==="여"?"rgba(249,168,212,0.18)":"rgba(147,197,253,0.12)",color:g==="여"?C.pink:C.blue});

function PhotoModal({members, onClose, onApply}) {
  const [imgData, setImgData] = useState(null);
  const [imgType, setImgType] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const fileRef = useRef();

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const result = ev.target.result;
      const b64 = result.split(',')[1];
      setImgData(b64);
      setImgType(file.type || 'image/jpeg');
    };
    reader.readAsDataURL(file);
  };

  const analyze = async () => {
    if (!imgData) { setError('이미지를 선택하세요'); return; }
    if (!bffBase()) { setError('설정 탭에서 BFF URL을 먼저 입력해 주세요'); return; }
    setLoading(true); setError('');
    try {
      const requestBody = {
        model: 'claude-opus-4-5',
        max_tokens: 2048,
        messages: [{
          role: 'user',
          content: [
            {type:'image', source:{type:'base64', media_type:imgType, data:imgData}},
            {type:'text', text:`이 골프 성적표에서 두 가지 목록을 추출하여 아래 JSON 형식으로 반환해주세요.

【출력 형식】
{
  "scores": [{"name":"...", "gender":"남/여", "score":숫자, "buddies":숫자, "pars":숫자, "bogeys":숫자, "longest":bool, "nearest":bool}],
  "perio":  [{"name":"...", "periScore":숫자}]
}

【scores 추출】 "스코어" 컬럼 + 버디/파/보기/롱기/니어 컬럼에서:
- "스코어" 컬럼의 모든 행: 성별, 이름, 타수(score)
- "버디" 컬럼의 모든 행: 이름, 버디수 → 이름으로 매칭
- "파" 컬럼의 모든 행: 이름, 파수 → 이름으로 매칭
- "보기" 컬럼의 모든 행: 이름, 보기수 → 이름으로 매칭
- "롱기(M)" 컬럼 1위 행의 이름 → longest:true
- "니어" 컬럼 1위 행의 이름 → nearest:true

【perio 추출】 "신(더블)페리오" 컬럼만 독립적으로 읽기:
- 각 행 형식: [이름] [HD값] [신페리오점수]
- HD값(작은 수)은 무시하고 신페리오점수(큰 수)만 추출
- 예) "권민근 20.4 71.6" → {"name":"권민근", "periScore":71.6}
- 예) "김앤드류 18 72" → {"name":"김앤드류", "periScore":72}
- 모든 행을 빠짐없이 추출

⚠️ 한글 이름 OCR 주의사항 (매우 중요):
- 비슷하게 생긴 글자를 혼동하지 마세요. 사진을 픽셀 단위로 정밀하게 다시 보고 정확히 추출하세요:
  - 김 vs 길 (ㅁ과 ㄹ의 차이 — 가로획 개수)
  - 박 vs 빅 (ㅏ와 ㅣ의 차이 — 짧은 가로획 유무)
  - 정 vs 종 (ㅓ와 ㅗ의 차이 — 가로획 위치)
  - 송 vs 송 (받침 ㅇ과 ㅁ 구분)
  - 윤 vs 운 (받침 ㄴ과 ㄴ을 구분)
  - 어세롱 vs 어세룡 ('롱'과 '룡' — ㅗ와 ㅛ의 점 개수)
- 같은 이름이 두 번 나오는 것이 자연스러우면 동명이인일 수 있으니 그대로 두 번 출력하세요.
- 흐린 글씨, 손글씨, 긁힌 글자라도 추측하지 말고 가장 가능성 높은 글자를 신중히 고르세요.

⚠️ scores와 perio는 완전히 독립적으로 추출. 행 번호로 연결하지 말 것.
JSON만 반환, 설명 없이.`},
          ],
        }],
      };
      const data = await bffFetch('/api/golf/analyze', {
        method: 'POST',
        body: JSON.stringify(requestBody),
      });
      const text = data.content[0].text.trim();
      const jsonObjStr = text.match(/\{[\s\S]*\}/)?.[0];
      if (!jsonObjStr) throw new Error('JSON 파싱 실패');
      const obj = JSON.parse(jsonObjStr);
      const periMap = {};
      (obj.perio || []).forEach(p => {
        periMap[p.name] = p.periScore;
      });
      const findPeri = (name) => {
        if (periMap[name] !== undefined) return periMap[name];
        const key = Object.keys(periMap).find(k => k.includes(name) || name.includes(k));
        return key !== undefined ? periMap[key] : 0;
      };
      const extracted = (obj.scores || []);
      const matched = {};
      const newMembers = [];
      // Greedy claim: each member can only be matched once. This handles
      // homonyms (e.g. two 김정섭) — first row gets the first 김정섭, second
      // row gets the second 김정섭. Without this, both would map to the same
      // member id and one row would silently disappear.
      const claimed = new Set();
      const findFreeMember = (name) => {
        // 1. exact match, unclaimed
        let m = members.find(x => !claimed.has(x.id) && x.name === name);
        if (m) return m;
        // 2. fuzzy contains match, unclaimed
        m = members.find(x => !claimed.has(x.id) && (x.name.includes(name) || name.includes(x.name)));
        return m || null;
      };
      extracted.forEach(row => {
        const periScore = findPeri(row.name);
        const member = findFreeMember(row.name);
        if (member) {
          claimed.add(member.id);
          matched[member.id] = {on:true, score:String(row.score||''), hd:String(periScore), buddies:row.buddies||0, pars:row.pars||0, bogeys:row.bogeys||0, longest:!!row.longest, nearest:!!row.nearest};
        } else {
          newMembers.push({name:row.name, gender:row.gender||'남', score:row.score, hd:periScore, buddies:row.buddies||0, pars:row.pars||0, bogeys:row.bogeys||0, longest:!!row.longest, nearest:!!row.nearest});
        }
      });
      onApply(matched, newMembers, extracted.length);
      onClose();
    } catch(e) {
      setError('오류: ' + (e.message || String(e)));
    } finally { setLoading(false); }
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.8)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:20,width:'100%',maxWidth:400}}>
        <div style={{fontWeight:700,color:C.accent,marginBottom:14,fontSize:15}}>📷 사진으로 성적 입력</div>
        <div style={{fontSize:11,color:C.dim,marginBottom:14}}>골프 성적표 사진을 업로드하면 AI가 자동으로 성적을 추출합니다.</div>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,color:C.dim,marginBottom:4}}>성적표 이미지</div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleFile}/>
          <button style={{...btn("g"),width:'100%',padding:"10px 0"}} onClick={()=>fileRef.current.click()}>
            {imgData ? '✅ 이미지 선택됨 (변경하기)' : '🖼 이미지 선택'}
          </button>
        </div>
        {error && <div style={{color:C.red,fontSize:12,marginBottom:10,background:'rgba(248,113,113,0.1)',padding:'8px 10px',borderRadius:8}}>{error}</div>}
        <div style={{display:'flex',gap:8}}>
          <button style={{...btn('p'),flex:1}} onClick={analyze} disabled={loading}>
            {loading ? '분석 중...' : '🤖 AI 분석'}
          </button>
          <button style={btn()} onClick={onClose}>취소</button>
        </div>
      </div>
    </div>
  );
}

function EntryTab({members, pendingNewMembers, sc, setSc, form, setForm, setShowPhoto, onSave, goEntry, cancelEntry}) {
  // effectiveMembers = persisted members + photo-detected new members not yet saved.
  // EntryTab treats them uniformly for display and lookup.
  const effectiveMembers = [...members, ...pendingNewMembers];

  // pending = ad-hoc rows the user typed in for people not yet in the member master.
  // These always start in edit mode because they have no existing data to display.
  const [pending, setPending] = useState([]);

  // checked = set of row IDs (member id for sc rows, tempId for pending rows) the user
  // has checked. The 수정 / 삭제 buttons act on these.
  const [checked, setChecked] = useState(new Set());

  // editing = set of row IDs currently in inline edit mode (name + all score fields editable).
  // Triggered by 수정 button on checked rows.
  const [editing, setEditing] = useState(new Set());

  // editedNames = { memberId → {name, gender} } overlay so that the name edits stay
  // visible during the EntryTab session. Sent to onSave via the editedMembers arg.
  const [editedNames, setEditedNames] = useState({});

  const addRow = () => {
    const tempId = uid();
    setPending(p => [...p, {tempId, name:'', score:'', hd:'', buddies:'', pars:'', bogeys:'', longest:false, nearest:false}]);
    setEditing(e => { const n = new Set(e); n.add(tempId); return n; });
  };
  const updPending = (tempId, field, val) => setPending(p => p.map(r => r.tempId===tempId ? {...r, [field]:val} : r));

  const toggleCheck = (id) => setChecked(s => {
    const n = new Set(s);
    if (n.has(id)) n.delete(id); else n.add(id);
    return n;
  });
  const toggleAll = () => {
    const allIds = [...Object.keys(sc), ...pending.map(p => p.tempId)];
    setChecked(s => s.size === allIds.length ? new Set() : new Set(allIds));
  };

  // Toggle edit mode for the checked rows. If ALL checked rows are already
  // editing, exit edit mode (수정 완료); otherwise enter edit mode for all
  // checked rows. This is the "수정 ↔ 수정 완료" toggle behavior.
  const toggleEditMode = () => {
    if (checked.size === 0) { alert('수정할 행을 체크해 주세요'); return; }
    const allEditing = [...checked].every(id => editing.has(id));
    setEditing(e => {
      const n = new Set(e);
      if (allEditing) {
        checked.forEach(id => n.delete(id));
      } else {
        checked.forEach(id => n.add(id));
      }
      return n;
    });
  };

  // Are all checked rows currently in edit mode? Used to flip the button label.
  const checkedAreEditing = checked.size > 0 && [...checked].every(id => editing.has(id));

  const deleteChecked = () => {
    if (checked.size === 0) { alert('삭제할 행을 체크해 주세요'); return; }
    if (!confirm(`${checked.size}개 행을 이번 라운드에서 제외합니다 (회원 자체는 삭제되지 않습니다). 계속할까요?`)) return;
    setSc(p => {
      const n = {...p};
      checked.forEach(id => { delete n[id]; });
      return n;
    });
    setPending(p => p.filter(r => !checked.has(r.tempId)));
    setEditing(e => { const n = new Set(e); checked.forEach(id => n.delete(id)); return n; });
    setEditedNames(en => {
      const n = {...en};
      checked.forEach(id => { delete n[id]; });
      return n;
    });
    setChecked(new Set());
  };

  const updateEditedName = (mid, field, val) => {
    setEditedNames(p => ({
      ...p,
      [mid]: {
        name: p[mid]?.name ?? (effectiveMembers.find(m => m.id === mid)?.name || ''),
        gender: p[mid]?.gender ?? (effectiveMembers.find(m => m.id === mid)?.gender || '남'),
        [field]: val,
      },
    }));
  };

  const handleSave = () => {
    // Validate all rows still in sc (read-only or editing both checked)
    for (const [mid, v] of Object.entries(sc)) {
      const masterName = effectiveMembers.find(x => x.id === mid)?.name || '?';
      const displayName = editedNames[mid]?.name || masterName;
      if (v.score === '' || v.hd === '') {
        alert(`[${displayName}] 스코어 또는 신페리오 점수를 입력해 주세요`);
        return;
      }
    }
    // Validate all pending rows
    for (const r of pending) {
      if (!r.name.trim())  { alert('이름을 입력해 주세요'); return; }
      if (r.score==='' || r.hd==='') { alert(`[${r.name}] 스코어 또는 신페리오 점수를 입력해 주세요`); return; }
    }
    // Build new members from pending rows (name dedup against effective member list)
    const newMembers = [];
    const extra = {};
    for (const r of pending) {
      let m = effectiveMembers.find(x => x.name === r.name.trim());
      if (!m) {
        m = {id:uid(), name:r.name.trim(), gender:'남'};
        newMembers.push(m);
      }
      extra[m.id] = {
        on: true,
        score: r.score, hd: r.hd,
        buddies: r.buddies || 0, pars: r.pars || 0, bogeys: r.bogeys || 0,
        longest: !!r.longest, nearest: !!r.nearest,
      };
    }
    // Build edited members list (only ones whose name or gender actually changed)
    const editedMembers = [];
    for (const [mid, ed] of Object.entries(editedNames)) {
      const orig = effectiveMembers.find(m => m.id === mid);
      if (!orig) continue;
      if (ed.name !== orig.name || ed.gender !== orig.gender) {
        editedMembers.push({id: mid, name: ed.name.trim(), gender: ed.gender});
      }
    }
    onSave({...sc, ...extra}, newMembers, editedMembers);
  };

  const participating = Object.keys(sc);
  const hasRows = participating.length > 0 || pending.length > 0;
  const allRowIds = [...participating, ...pending.map(p => p.tempId)];
  const allChecked = allRowIds.length > 0 && allRowIds.every(id => checked.has(id));

  // Helpers
  const numCell = (val, onChange, disabled = false, w = 48) => (
    <input type="number" min="0" disabled={disabled}
      style={{background:"#060c06",border:`1px solid ${C.border}`,color:disabled?C.dim:C.text,borderRadius:5,
        padding:"4px 3px",width:w,textAlign:"center",fontSize:12,outline:"none",fontFamily:"inherit",
        opacity: disabled ? 0.6 : 1}}
      value={val ?? ""} onChange={e=>!disabled && onChange(e.target.value)} placeholder="0"/>
  );

  const updScField = (mid, field, val) => setSc(p => ({...p, [mid]: {...p[mid], [field]: val}}));
  const chkToggleSc = (mid, field) => setSc(p => ({...p, [mid]: {...p[mid], [field]: !p[mid]?.[field]}}));
  const chkTogglePending = (tempId, field) => setPending(p => p.map(r => r.tempId===tempId ? {...r, [field]:!r[field]} : r));

  const chkBtn = (active, onClick, disabled = false) => (
    <button onClick={onClick} disabled={disabled} style={{
      padding:"2px 5px", borderRadius:5,
      border:`1px solid ${active?C.accent:C.border}`,
      background:active?C.accentLow:"transparent",
      color:active?C.accent:C.dim, fontSize:11,
      cursor: disabled ? "default" : "pointer",
      fontFamily:"inherit", fontWeight:active?700:400,
      opacity: disabled ? 0.6 : 1,
    }}>
      {active?"●":"○"}
    </button>
  );

  // Display name and gender for an existing member, possibly overridden by edits
  const dispName = (m) => editedNames[m.id]?.name ?? m.name;
  const dispGender = (m) => editedNames[m.id]?.gender ?? m.gender;

  return (<>
    <div style={{...cardSt,overflow:"hidden"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontWeight:700,color:C.accent}}>새 라운드 입력</div>
        <button style={{...btn("g"),padding:"6px 12px",fontSize:12}} onClick={()=>setShowPhoto(true)}>📷 사진으로 입력</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:0}}>
          <label style={{fontSize:11,color:C.dim}}>날짜</label>
          <input type="date" style={{...iSt,colorScheme:"dark",WebkitAppearance:"none",appearance:"none",lineHeight:"normal",padding:"9px 10px",minWidth:0}}
            value={form.date} onChange={e=>setForm(p=>({...p,date:e.target.value}))}/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:0}}>
          <label style={{fontSize:11,color:C.dim}}>코스명</label>
          <input type="text" style={{...iSt,lineHeight:"normal",padding:"9px 10px",minWidth:0}}
            value={form.course} onChange={e=>setForm(p=>({...p,course:e.target.value}))} placeholder="예: 남서울 CC"/>
        </div>
      </div>
    </div>

    {hasRows ? (<>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div style={{fontSize:11,color:C.dim}}>참가자 {participating.length + pending.length}명 · 핸디점수 자동계산</div>
        {checked.size > 0 && <div style={{fontSize:11,color:C.accent}}>{checked.size}개 선택됨</div>}
      </div>
      <div style={{...cardSt,padding:0,overflow:"hidden"}}>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:560}}>
            <thead><tr>
              <th style={{...thSt,paddingLeft:8,paddingRight:3,width:24}}>
                <input type="checkbox" checked={allChecked} onChange={toggleAll}
                  style={{cursor:"pointer",accentColor:C.accent}}/>

function SettingsTab({saveError}) {

  const [newCap, setNewCap] = useState('');
  const [adminPw, setAdminPw] = useState('');
  const [capMsg, setCapMsg] = useState('');

  const [wipePw, setWipePw] = useState('');
  const [wipeConfirm, setWipeConfirm] = useState(false);
  const [wipeMsg, setWipeMsg] = useState('');

  const loadUsage = async () => {
    setUsageError('');

    try {
      const u = await bffFetch('/api/golf/usage');
      setUsage(u);
      if (newCap === '') setNewCap(String(u.cap));

      setUsage(null);
      setUsageError(e.message || String(e));
    }

  useEffect(() => { loadUsage(); }, []);

    localStorage.setItem('amp99_bff_url', bffUrl.trim());

    setSavedConn(true);
    setTimeout(() => setSavedConn(false), 2000);
    loadUsage();
    // notify App to reload data with the new connection settings
    window.dispatchEvent(new CustomEvent('amp99-bff-changed'));
  };

  const submitCap = async () => {
    setCapMsg('');
    const n = parseInt(newCap, 10);
    if (isNaN(n) || n < 0) { setCapMsg('cap은 0 이상의 정수여야 합니다'); return; }

    try {
      await bffFetch('/api/golf/cap', {
        method: 'POST',
        body: JSON.stringify({cap: n}),
        adminAuth: adminPw.trim(),
      });
      setCapMsg('✓ 변경됨');
      setAdminPw('');
      loadUsage();
    } catch (e) {
      setCapMsg('오류: ' + (e.message || String(e)));
    }
  };

  const submitWipe = async () => {
    setWipeMsg('');
    if (!wipePw.trim()) { setWipeMsg('관리자 비밀번호를 입력해 주세요'); return; }

      setWipeConfirm(false);

    } catch (e) {
      setWipeMsg('오류: ' + (e.message || String(e)));
      setWipeConfirm(false);
    }
  };

  const cancelWipe = () => {

            BFF 서버에 설정된 공유 비밀번호. 모든 데이터/사진 분석 요청에 사용됩니다.
          </div>

        <button style={{...btn("p"),width:"100%"}} onClick={saveConn}>저장</button>
        {savedConn && <div style={{marginTop:8,textAlign:"center",color:C.accent,fontSize:12}}>✓ 저장됨</div>}
      </div>

      <div style={{...cardSt}}>
        <div style={{fontWeight:700,color:C.accent,marginBottom:10}}>📊 사용량 / 한도</div>
        {!bffUrl.trim() && (

function App() {
  const [members, setMembers] = useState([]);
  const [rounds, setRounds]   = useState([]);
  const [tab, setTab]         = useState("view");
  const [sel, setSel]         = useState("");
  const [mode, setMode]       = useState("perio");
  const [form, setForm]       = useState({date:"", course:""});
  const [sc, setSc]           = useState({});
  const [mf, setMf]           = useState({name:"", gender:"남"});
  const [editId, setEditId]   = useState(null);
  const [delId, setDelId]     = useState(null);
  const [focus, setFocus]     = useState(null);
  const [showPhoto, setShowPhoto] = useState(false);
  const [loadError, setLoadError] = useState('');
  const [loading, setLoading]     = useState(true);
  const [saveStatus, setSaveStatus] = useState(''); // '', 'saving', 'ok', 'error'
  const [saveError, setSaveError] = useState('');
  // pendingNewMembers — members the photo AI detected as new but that have NOT
  // been persisted to BFF yet. They live here until the user clicks 저장 in
  // EntryTab; cancelling discards them. Shape: [{id, name, gender}]
  const [pendingNewMembers, setPendingNewMembers] = useState([]);

  // Load all data from BFF on mount
  useEffect(() => {
    // Convert BFF response (periScore) → frontend shape (hd) for back-compat
    // with existing render/sort code that uses s.hd everywhere.
    const normalizeRounds = (rounds) => rounds.map(r => ({
      id: r.id,
      date: r.date,
      course: r.course,
      scores: r.scores.map(s => ({
        memberId: s.memberId,
        score: s.score,
        hd: s.periScore,
        buddies: s.buddies,
        pars: s.pars,
        bogeys: s.bogeys,
        longest: s.longest,
        nearest: s.nearest,
      })),
    }));

    const loadData = async () => {
      setLoading(true);
      setLoadError('');
      try {
        const data = await bffFetch('/api/golf/data');
        const normRounds = normalizeRounds(data.rounds);
        setMembers(data.members);
        setRounds(normRounds);
        setSel(normRounds.length ? [...normRounds].sort((a,b)=>b.date.localeCompare(a.date))[0].id : '');
      } catch (e) {
        setLoadError('데이터 로드 실패: ' + (e.message || String(e)));
      } finally {
        setLoading(false);
      }
    };
    loadData();

    // React to BFF connection changes from the Settings tab
    const onBffChanged = () => loadData();
    window.addEventListener('amp99-bff-changed', onBffChanged);

    // Clean up legacy localStorage keys (one-time, silent)
    try {
      localStorage.removeItem('amp99_apikey');
      localStorage.removeItem('amp99_github_pat');
    } catch (e) {}

    return () => window.removeEventListener('amp99-bff-changed', onBffChanged);
  }, []);

  // When the user enters the 회원관리 tab, refresh from BFF so they always
  // see the canonical state. This is a safety net — the only place where
  // members get persisted should be the round-save flow, but if any other
  // path silently mutates the master we want this tab to surface it.
  useEffect(() => {
    if (tab === "members") {
      reloadData().catch(() => { /* surfaced via saveError */ });
    }
  }, [tab]);

  // Convert BFF response (periScore) → frontend shape (hd)
  const normalizeRounds = (rounds) => rounds.map(r => ({
    id: r.id,
    date: r.date,
    course: r.course,
    scores: r.scores.map(s => ({
      memberId: s.memberId,
      score: s.score,
      hd: s.periScore,
      buddies: s.buddies,
      pars: s.pars,
      bogeys: s.bogeys,
      longest: s.longest,
      nearest: s.nearest,
    })),
  }));

  const reloadData = async () => {
    try {
      const data = await bffFetch('/api/golf/data');
      const normRounds = normalizeRounds(data.rounds);
      setMembers(data.members);
      setRounds(normRounds);
      return {members: data.members, rounds: normRounds};
    } catch (e) {
      setSaveError(e.message || String(e));
      throw e;
    }
  };

  const withSaveStatus = async (fn) => {
    setSaveStatus('saving'); setSaveError('');
    try {
      await fn();
      setSaveStatus('ok');
      setTimeout(() => setSaveStatus(''), 2500);
    } catch (e) {
      setSaveStatus('error');
      setSaveError(e.message || String(e));
    }
  };

  const gm = (id) => members.find(m => m.id === id) || {name:"?", gender:"남"};
  const cur = rounds.find(r => r.id === sel) || rounds[0];
  const enrich = (r) => r.scores.map(s => ({...s, hs:hdScore(s.score), member:gm(s.memberId)}));
  const rankArr = (arr, keyFn) => {
    const sorted = [...arr].sort((a,b) => keyFn(a) - keyFn(b));
    const ranks = [];
    sorted.forEach((s,i) => {
      ranks.push(i===0 ? 1 : (keyFn(s)===keyFn(sorted[i-1]) ? ranks[i-1] : i+1));
    });
    return sorted.map((s,i) => ({...s, rank:ranks[i]}));
  };
  const gross = cur ? rankArr(enrich(cur), s=>s.score) : [];
  const perio = cur ? rankArr(enrich(cur), s=>parseFloat(s.hd)||0) : [];
  const disp  = mode === "perio" ? perio : gross;
  const teamAvg = cur ? avg(cur.scores.map(s=>s.score)).toFixed(1) : "-";

  const goEntry = () => {
    setForm({date:new Date().toISOString().slice(0,10), course:""});
    setSc({}); setPendingNewMembers([]); setTab("entry");
  };

  // Cancel/leave the entry tab without saving — discard all transient state.
  const cancelEntry = () => {
    setSc({});
    setPendingNewMembers([]);
    setTab("view");
  };

  // EntryTab calls this with:
  //   mergedSc: { memberId → {score, hd, buddies, ...} } — only rows still in sc are saved
  //   newMembersList: ad-hoc new members typed into EntryTab pending rows
  //   editedMembers: existing members whose name/gender was changed in-place (need PUT /members/{id})
  // saveRound also persists any photo-detected pending members (App-level state).
  const saveRound = (mergedSc, newMembersList, editedMembers) => {
    if (!form.date || !form.course.trim()) { alert("날짜와 코스명을 입력하세요"); return; }
    const newId = uid();
    // Combine the two new-member sources, deduped by id, and only keep ones
    // whose row actually survived in mergedSc (so deletions are respected).
    const usedIds = new Set(Object.keys(mergedSc));
    const allNew = [...(newMembersList || []), ...pendingNewMembers]
      .filter((m, i, arr) => arr.findIndex(x => x.id === m.id) === i)
      .filter(m => usedIds.has(m.id));
    withSaveStatus(async () => {
      // 1. Apply edits to existing members (rename / gender change). Only edits
      // for members already in the BFF — pending photo members get their
      // edits via the create call below.
      const existingIds = new Set(members.map(m => m.id));
      const pendingIds = new Set(allNew.map(m => m.id));
      if (editedMembers && editedMembers.length > 0) {
        for (const m of editedMembers) {
          if (existingIds.has(m.id)) {
            await bffFetch(`/api/golf/members/${encodeURIComponent(m.id)}`, {
              method: 'PUT',
              body: JSON.stringify({name: m.name, gender: m.gender || '남'}),
            });
          } else if (pendingIds.has(m.id)) {
            // Apply the edit to the in-memory pending member so the create
            // below uses the new name/gender.
            const idx = allNew.findIndex(x => x.id === m.id);
            if (idx >= 0) {
              allNew[idx] = {...allNew[idx], name: m.name, gender: m.gender || '남'};
            }
          }
        }
      }
      // 2. Create all pending new members (photo-detected + EntryTab ad-hoc)
      for (const m of allNew) {
        await bffFetch('/api/golf/members', {
          method: 'POST',
          body: JSON.stringify({id: m.id, name: m.name, gender: m.gender || '남'}),
        });
      }
      // 3. Build score list and create the round
      const list = Object.entries(mergedSc)
        .filter(([mid, v]) => v.on !== false && v.score !== '')
        .map(([mid, v]) => ({
          memberId: mid,
          score: +v.score || 0,
          periScore: +v.hd || 0,
          buddies: +v.buddies || 0,
          pars: +v.pars || 0,
          bogeys: +v.bogeys || 0,
          longest: !!v.longest,
          nearest: !!v.nearest,
        }));
      await bffFetch('/api/golf/rounds', {
        method: 'POST',
        body: JSON.stringify({id: newId, date: form.date, course: form.course.trim(), scores: list}),
      });
      // 4. Reset transient state and reload
      setPendingNewMembers([]);
      setSc({});
      await reloadData();
      setSel(newId);
      setTab("view");
    });
  };

  const saveMember = () => {
    if (!mf.name.trim()) return;
    withSaveStatus(async () => {
      if (editId) {
        await bffFetch(`/api/golf/members/${encodeURIComponent(editId)}`, {
          method: 'PUT',
          body: JSON.stringify({name: mf.name.trim(), gender: mf.gender}),
        });
        setEditId(null);
      } else {
        await bffFetch('/api/golf/members', {
          method: 'POST',
          body: JSON.stringify({id: uid(), name: mf.name.trim(), gender: mf.gender}),
        });
      }
      setMf({name: "", gender: "남"});
      await reloadData();
    });
  };

  const deleteMember = (id) => {
    setDelId(null);
    withSaveStatus(async () => {
      await bffFetch(`/api/golf/members/${encodeURIComponent(id)}`, {method: 'DELETE'});
      await reloadData();
    });
  };

  const applyPhoto = (matched, newMembers, total) => {
    // Hold new members in client-only state. They are persisted to the BFF
    // only when the user clicks 저장 in EntryTab; 취소 discards them.
    let created = [];
    if (newMembers.length > 0) {
      created = newMembers.map(nm => ({
        id: uid(),
        name: nm.name,
        gender: nm.gender || '남',
      }));
      created.forEach((m, i) => {
        const nm = newMembers[i];
        matched[m.id] = {
          on: true,
          score: String(nm.score || ''),
          hd: String(nm.hd || ''),
          buddies: nm.buddies || 0,
          pars: nm.pars || 0,
          bogeys: nm.bogeys || 0,
          longest: !!nm.longest,
          nearest: !!nm.nearest,
        };
      });
      setPendingNewMembers(p => [...p, ...created]);
    }
    setSc(p => {
      const next = {...p};
      Object.entries(matched).forEach(([id, vals]) => {
        next[id] = {on: true, score: "", hd: "", buddies: 0, pars: 0, bogeys: 0, longest: false, nearest: false, ...vals};
      });
      return next;
    });
    const lines = [`${total}명 중 ${Object.keys(matched).length}명 자동 입력`];
    if (created.length) lines.push(`임시 회원 추가: ${created.map(m => m.name).join(', ')}\n(저장을 눌러야 회원으로 영구 등록됩니다)`);
    alert(lines.join('\n'));
  };

  const stats = members.map(m => {
    const h = rounds.flatMap(r => r.scores.filter(s => s.memberId===m.id).map(s => ({...s, date:r.date, course:r.course})));
    if (!h.length) return null;
    const sc2 = h.map(x => x.score);
    return {...m, hist:h, games:h.length, avg:avg(sc2).toFixed(1), best:Math.min(...sc2), avgHd:avg(h.map(x=>x.hd)).toFixed(1), buds:h.reduce((a,x)=>a+(x.buddies||0),0)};
  }).filter(Boolean).sort((a,b) => parseFloat(a.avg)-parseFloat(b.avg));

  return (
    <div style={{background:C.bg,minHeight:"100vh",color:C.text,fontFamily:"'Apple SD Gothic Neo','Noto Sans KR',sans-serif",display:"flex",flexDirection:"column",maxWidth:540,margin:"0 auto"}}>
      {showPhoto && <PhotoModal members={members} onClose={()=>setShowPhoto(false)} onApply={applyPhoto}/>}

      {/* 헤더 */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"11px 16px",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:10}}>
        <span style={{fontSize:22}}>⛳</span>
        <div>
          <div style={{fontSize:15,fontWeight:800,color:C.accent,letterSpacing:"-0.5px"}}>서울대 AMP99</div>
          <div style={{fontSize:10,color:C.dim}}>월례회 성적 관리</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
          {saveStatus==='saving' && <span style={{fontSize:11,color:C.dim}}>저장 중...</span>}
          {saveStatus==='ok' && <span style={{fontSize:11,color:C.accent}}>✓ 저장됨</span>}
          {saveStatus==='error' && <span style={{fontSize:11,color:C.red}} title={saveError}>⚠ 저장 실패</span>}
          <span style={{fontSize:11,color:C.dim}}>{rounds.length}라운드·{members.length}명</span>
        </div>
      </div>

      <div style={{flex:1,padding:"12px 13px",overflowY:"auto"}}>

        {loadError && (
          <div style={{background:'rgba(248,113,113,0.1)',border:`1px solid ${C.red}`,borderRadius:10,padding:"12px 14px",marginBottom:12,color:C.red,fontSize:13}}>
            ⚠ {loadError}
          </div>
        )}

        {/* ── 로딩 ── */}
        {loading && <div style={{textAlign:"center",padding:48,color:C.dim}}>⏳ 데이터 로딩 중...</div>}

        {/* ── 성적 조회 ── */}
        {!loading && tab==="view" && cur && (<>
          <div style={{position:"relative",marginBottom:12}}>
            <div style={{fontSize:11,color:C.dim,marginBottom:4}}>라운드 선택</div>
            <div style={{position:"relative"}}>
              <select style={{...iSt,paddingRight:36,appearance:"none",WebkitAppearance:"none",cursor:"pointer"}} value={sel} onChange={e=>setSel(e.target.value)}>
                {[...rounds].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>(
                  <option key={r.id} value={r.id}>{r.date} · {r.course} ({r.scores.length}명)</option>
                ))}
              </select>
              <span style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",pointerEvents:"none",color:C.dim,fontSize:12}}>▼</span>
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7,marginBottom:12}}>
            {[
              {label:"🥇 메달리스트",  name:gross[0]?.member.name, val:gross[0]?.score, color:C.gold},
              {label:"🏆 페리오 우승", name:perio[0]?.member.name, val:perio[0]?.hd.toFixed(1), color:C.accent},
              {label:"🥈 준우승",      name:perio[1]?.member.name, val:perio[1]?.hd.toFixed(1), color:C.silver},
            ].map(x=>(
              <div key={x.label} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 8px",textAlign:"center",borderTop:`2px solid ${x.color}`}}>
                <div style={{fontSize:9,color:C.dim,marginBottom:3}}>{x.label}</div>
                <div style={{fontSize:12,fontWeight:700,color:x.color,marginBottom:1}}>{x.name}</div>
                <div style={{fontSize:22,fontWeight:800,color:C.accent,lineHeight:1.2}}>{x.val}</div>
              </div>
            ))}
          </div>

          <div style={{display:"flex",gap:7,marginBottom:10}}>
            {[["perio","신(더블)페리오"],["gross","그로스"]].map(([v,l])=>(
              <button key={v} onClick={()=>setMode(v)}
                style={{flex:1,padding:"8px 0",borderRadius:8,border:`1px solid ${mode===v?C.accent:C.border}`,background:mode===v?C.accentLow:"transparent",color:mode===v?C.accent:C.dim,fontSize:12,fontWeight:mode===v?700:400,cursor:"pointer",fontFamily:"inherit"}}>{l}</button>
            ))}
          </div>

          <div style={{...cardSt,padding:0,overflow:"hidden"}}>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",minWidth:440}}>
                <thead><tr>
                  {(mode==="gross"
                    ? ["순위","이름","","스코어","핸디","버디","파","보기","롱기","니어"]
                    : ["순위","이름","","신페리오 점수","스코어","버디","파","보기","롱기","니어"]
                  ).map((h,i)=>(
                    <th key={i} style={{...thSt,textAlign:i===1?"left":"center",paddingLeft:i===1?8:3,paddingRight:3}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {disp.map(row=>(
                    <tr key={row.memberId} style={{background:row.rank===1?"rgba(251,191,36,0.05)":"transparent"}}>
                      <td style={tdSt}>
                        <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:22,height:22,borderRadius:"50%",
                          background:row.rank<=3?rankColor(row.rank):"transparent",
                          color:row.rank<=3?"#000":C.dim,fontSize:12,fontWeight:700}}>{row.rank}</span>
                      </td>
                      <td style={{...tdSt,textAlign:"left",paddingLeft:8,fontWeight:row.rank<=3?700:500,color:rankColor(row.rank)}}>{row.member.name}</td>
                      <td style={{...tdSt,padding:"9px 3px"}}><span style={gTag(row.member.gender)}>{row.member.gender}</span></td>
                      {mode==="gross" ? (<>
                        <td style={{...tdSt,fontWeight:700,color:row.rank<=3?rankColor(row.rank):C.text,padding:"9px 3px"}}>{row.score}</td>
                        <td style={{...tdSt,color:C.dim,padding:"9px 3px"}}>{row.hs}</td>
                      </>) : (<>
                        <td style={{...tdSt,fontWeight:700,color:row.rank<=3?rankColor(row.rank):C.accent,padding:"9px 3px"}}>{parseFloat(row.hd).toFixed(1)}</td>
                        <td style={{...tdSt,fontWeight:600,color:C.text,padding:"9px 3px"}}>{row.score}</td>
                      </>)}
                      <td style={{...tdSt,color:row.buddies>0?C.accent:C.dim,padding:"9px 3px"}}>{row.buddies>0?`★${row.buddies}`:"—"}</td>
                      <td style={{...tdSt,padding:"9px 3px"}}>{row.pars}</td>
                      <td style={{...tdSt,padding:"9px 3px"}}>{row.bogeys}</td>
                      <td style={{...tdSt,padding:"9px 3px",color:row.longest?C.gold:C.dim,fontWeight:row.longest?700:400}}>{row.longest?"★":"—"}</td>
                      <td style={{...tdSt,padding:"9px 3px",color:row.nearest?C.blue:C.dim,fontWeight:row.nearest?700:400}}>{row.nearest?"★":"—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          <div style={{textAlign:"center",color:C.dim,fontSize:11,marginTop:5,marginBottom:8}}>
            {cur.date} · {cur.course} · 팀 평균 {teamAvg}타 · {cur.scores.length}명 참가
          </div>
        </>)}

        {/* ── 성적 입력 ── */}
        {tab==="entry" && (<EntryTab
          members={members} pendingNewMembers={pendingNewMembers}
          sc={sc} setSc={setSc} form={form} setForm={setForm}
          setShowPhoto={setShowPhoto} onSave={saveRound}
          goEntry={goEntry} cancelEntry={cancelEntry}
        />)}

        {/* ── 회원 관리 ── */}
        {tab==="members" && (<>
          <div style={cardSt}>
            <div style={{fontWeight:700,color:C.accent,marginBottom:10}}>{editId?"회원 수정":"회원 추가"}</div>
            <div style={{display:"flex",gap:8}}>
              <input style={{...iSt,flex:1}} value={mf.name} placeholder="이름"
                onChange={e=>setMf(p=>({...p,name:e.target.value}))}
                onKeyDown={e=>e.key==="Enter"&&saveMember()}/>
              <select style={{...iSt,width:62}} value={mf.gender} onChange={e=>setMf(p=>({...p,gender:e.target.value}))}>
                <option value="남">남</option><option value="여">여</option>
              </select>
              <button style={btn("p")} onClick={saveMember}>{editId?"수정":"추가"}</button>
              {editId&&<button style={btn()} onClick={()=>{setEditId(null);setMf({name:"",gender:"남"});}}>취소</button>}
            </div>
          </div>
          <div style={{fontSize:12,color:C.dim,marginBottom:8}}>총 {members.length}명</div>
          {members.map((m,i)=>(
            <div key={m.id} style={{...cardSt,display:"flex",alignItems:"center",padding:"9px 13px",marginBottom:6}}>
              <span style={{color:C.dim,fontSize:11,width:24}}>{i+1}.</span>
              <span style={{flex:1,fontWeight:500}}>{m.name}</span>
              <span style={{...gTag(m.gender),marginRight:10}}>{m.gender}</span>
              {delId===m.id?(<>
                <button style={{...btn("r"),padding:"5px 9px",fontSize:11,marginRight:5}}
                  onClick={()=>deleteMember(m.id)}>확인</button>
                <button style={{...btn(),padding:"5px 9px",fontSize:11}} onClick={()=>setDelId(null)}>취소</button>
              </>):(<>
                <button style={{...btn(),padding:"5px 9px",fontSize:11,marginRight:5}}
                  onClick={()=>{setEditId(m.id);setMf({name:m.name,gender:m.gender});}}>수정</button>
                <button style={{...btn("r"),padding:"5px 9px",fontSize:11}} onClick={()=>setDelId(m.id)}>삭제</button>
              </>)}
            </div>
          ))}
        </>)}

        {/* ── 설정 ── */}
        {tab==="settings" && <SettingsTab saveError={saveError}/>}

        {/* ── 통계 ── */}
        {tab==="stats" && (<>
          <div style={cardSt}>
            <div style={{fontWeight:700,color:C.accent,marginBottom:10}}>전체 통계</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,textAlign:"center"}}>
              {[
                {label:"라운드",val:`${rounds.length}회`},
                {label:"참가자",val:`${stats.length}명`},
                {label:"그룹평균",val:stats.length?avg(stats.map(m=>parseFloat(m.avg))).toFixed(1):"-"},
                {label:"최저타",val:stats.length?Math.min(...stats.map(m=>m.best)):"-"},
              ].map(x=>(
                <div key={x.label}>
                  <div style={{fontSize:9,color:C.dim,marginBottom:2}}>{x.label}</div>
                  <div style={{fontSize:18,fontWeight:800,color:C.accent}}>{x.val}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{fontSize:11,color:C.dim,marginBottom:8}}>카드를 탭하면 상세 기록 확인</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            {stats.map((m,i)=>(
              <div key={m.id} style={{...cardSt,marginBottom:0,cursor:"pointer",borderColor:focus===m.id?C.accent:C.border}}
                onClick={()=>setFocus(focus===m.id?null:m.id)}>
                <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:7}}>
                  <span style={{fontSize:10,color:C.dim,fontWeight:700}}>{i+1}위</span>
                  <span style={{fontWeight:700,fontSize:13}}>{m.name}</span>
                  <span style={gTag(m.gender)}>{m.gender}</span>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:3,fontSize:11}}>
                  <div><span style={{color:C.dim}}>평균 </span><span style={{fontWeight:700,color:C.accent}}>{m.avg}</span></div>
                  <div><span style={{color:C.dim}}>베스트 </span><span style={{fontWeight:700,color:C.gold}}>{m.best}</span></div>
                  <div><span style={{color:C.dim}}>참가 </span><span>{m.games}회</span></div>
                  <div><span style={{color:C.dim}}>버디 </span><span style={{color:m.buds>0?C.accent:C.dim}}>★{m.buds}</span></div>
                </div>
              </div>
            ))}
          </div>
          {focus&&(()=>{
            const m=stats.find(x=>x.id===focus);if(!m)return null;
            return(
              <div style={cardSt}>
                <div style={{fontWeight:700,color:C.accent,marginBottom:10}}>{m.name} · {m.games}회 · 평균 신페리오 {m.avgHd}</div>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead><tr>{["날짜","코스","스코어","신페리오 점수","핸디","버디"].map(h=><th key={h} style={thSt}>{h}</th>)}</tr></thead>
                  <tbody>
                    {m.hist.sort((a,b)=>b.date.localeCompare(a.date)).map((h,i)=>(
                      <tr key={i}>
                        <td style={tdSt}>{h.date}</td>
                        <td style={{...tdSt,fontSize:10,color:C.dim}}>{h.course}</td>
                        <td style={{...tdSt,fontWeight:700,color:h.score===m.best?C.gold:C.text}}>{h.score}</td>
                        <td style={{...tdSt,fontWeight:600,color:C.accent}}>{parseFloat(h.hd).toFixed(1)}</td>
                        <td style={{...tdSt,color:C.dim}}>{hdScore(h.score)}</td>
                        <td style={{...tdSt,color:h.buddies>0?C.accent:C.dim}}>{h.buddies>0?`★${h.buddies}`:"—"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
          })()}
        </>)}
      </div>

      {/* 탭 바 */}
      <div style={{display:"flex",background:C.surface,borderTop:`1px solid ${C.border}`,position:"sticky",bottom:0}}>
        {[["view","🏆","성적조회"],["entry","✏️","성적입력"],["members","👥","회원관리"],["stats","📊","통계"],["settings","⚙️","설정"]].map(([id,icon,label])=>(
          <button key={id} onClick={()=>id==="entry"?goEntry():setTab(id)}
            style={{flex:1,padding:"10px 0",border:"none",background:"none",color:tab===id?C.accent:C.dim,fontSize:10,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,fontFamily:"inherit",borderTop:`2px solid ${tab===id?C.accent:"transparent"}`}}>
            <span style={{fontSize:19}}>{icon}</span>
            <span style={{fontWeight:tab===id?700:400}}>{label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
